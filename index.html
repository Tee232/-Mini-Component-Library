<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re-usable Component</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Nav Bar -->
    <div class="navbar">
      <h5>Home</h5>
      <a href="#">Products</a>
      <a href="#">About Us</a>
      <a href="#">Contact</a>
    </div>

    <!-- Buttons -->
    <div class="button-container">
      <button class="button-primary">Primary</button>
      <button class="button-secondary">Secondary</button>
      <button class="button-disabled" disabled>Disabled</button>
    </div>

    <!-- Inputs + Error State -->

    <div class="input-group">
      <label for="email">Email Address</label>
      <input
        class="input"
        type="email"
        id="email"
        name="email"
        placeholder="Enter email address"
      />
      <input class="input input-error" placeholder="Enter email address" />
      <p class="error-text">Email is required</p>
    </div>

    <!-- Cards -->
    <div class="card-container">
      <div class="card">
        <h3>Card Title</h3>
        <p>Card description goes here.</p>
      </div>
    </div>

    <!-- Badges -->
    <div class="badge-container">
      <span class="badge badge-success">Success</span>
      <span class="badge badge-warning">Pending</span>
      <span class="badge badge-error">Failed</span>
    </div>

    <!-- Alerts -->
    <div class="alert-container">
      <div class="alert alert-success">
        <div class="content-container">
          <img src="./images/success icon.svg" alt="checkmark" />
          <p class="text">Your action was successful!</p>
        </div>
        <div class="cancel-icon">
          <img src="./images/proicons_cancel (1).svg" alt="x icon" />
        </div>
      </div>
      <div class="alert-warning">
        <div class="content-containerr">
          <img src="./images/warning icon.svg" alt="warning" />
          <p class="textt">Connection failed.</p>
        </div>
        <div class="cancell-icon">
          <img src="./images/proicons_cancel-yellow.svg" alt="x icon" />
        </div>
      </div>
      <div class="alert-failed">
        <div class="content-containeerr">
          <img src="./images/error icon.svg" alt="failed" />
          <p class="texxtt">Something went wrong.</p>
        </div>
        <div class="cancell-iccon">
          <img src="./images/proicons_cancel-red.svg" alt="x icon" />
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal-container">
      <div class="modal-content">
        <div class="image">
          <img src="./images/illusrtation.svg" alt="" />
        </div>

        <div class="teexts">
          <h3>Modal Title</h3>
          <p>This is the modal description.</p>
        </div>
      </div>
    </div>
  </body>
</html>
